<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>微读 Read</title>
  <link rel="preload" href="/vendor/vue.global.prod.js" as="script">
  <link rel="preload" href="/vendor/vue-router.global.prod.js" as="script">
  <link rel="preload" href="/vendor/element-plus.min.js" as="script">
  <link rel="stylesheet" href="/vendor/element-plus.css">
  <link rel="stylesheet" href="/src/styles.css">
  <style>
    #app:empty { display:flex; align-items:center; justify-content:center; height:100vh; }
    #app:empty::after { content:''; width:32px; height:32px; border:3px solid #e5e5e5; border-top-color:#409eff; border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg) } }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- 本地 vendor：不阻塞解析，按 defer 顺序执行 -->
  <script defer src="/vendor/vue.global.prod.js"></script>
  <script defer src="/vendor/vue-router.global.prod.js"></script>
  <script defer src="/vendor/element-plus.min.js"></script>
  <script defer src="/vendor/icons-vue.min.js"></script>
  <script defer src="/vendor/marked.min.js"></script>
  <!-- main.js 是 module，自动 defer，等上面全部执行完后再跑 -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
